name: Security Audit

on:
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: set up repo
              uses: actions/checkout@v7
            - name: install node and npm
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      animations/gmanim/package-lock.json
            - name: install dependencies
              run: npm ci
            - name: audit site dependencies
              run: npm audit --audit-level=high
            - name: install animation dependencies
              working-directory: animations/gmanim
              run: npm ci
            - name: audit animation dependencies
              working-directory: animations/gmanim
              run: npm audit --audit-level=high
