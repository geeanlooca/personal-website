name: Docker Image

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: set up repo
              uses: actions/checkout@v7
            - name: install node and npm
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: install dependencies
              run: npm ci
            - name: audit dependencies
              run: npm audit --audit-level=high
            - name: set up docker buildx
              uses: docker/setup-buildx-action@v4
            - name: build test image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  push: false
                  tags: personal-website:test
                  build-args: |
                      GIT_SHA=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false
            - name: smoke test image
              run: |
                  trap 'docker rm -f site-test >/dev/null 2>&1 || true' EXIT
                  docker run -d --name site-test -p 8080:8080 personal-website:test
                  for i in $(seq 1 20); do
                    if curl -fsS http://localhost:8080/ > /dev/null; then break; fi
                    sleep 2
                  done
                  curl -fsS http://localhost:8080/ | grep -q "Gianluca"
                  curl -fsS http://localhost:8080/resume/ > /dev/null
            - name: log in to ghcr
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: push image
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              env:
                  IMAGE: ghcr.io/${{ github.repository }}
              run: |
                  docker tag personal-website:test "$IMAGE:latest"
                  docker tag personal-website:test "$IMAGE:${{ github.sha }}"
                  docker push "$IMAGE:latest"
                  docker push "$IMAGE:${{ github.sha }}"
