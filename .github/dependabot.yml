version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          eleventy:
              patterns:
                  - "@11ty/*"
          tooling:
              dependency-type: development

    - package-ecosystem: npm
      directory: "/animations/gmanim"
      schedule:
          interval: weekly
      open-pull-requests-limit: 5

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
