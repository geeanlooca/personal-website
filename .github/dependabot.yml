version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          eleventy:
              patterns:
                  - "@11ty/*"
          tooling:
              dependency-type: development

    - package-ecosystem: npm
      directory: "/animations/gmanim"
      schedule:
          interval: weekly
      open-pull-requests-limit: 5

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly

    - package-ecosystem: docker
      directory: "/"
      schedule:
          interval: weekly
      ignore:
          # Node LTS versions are even-numbered. Bump the major manually.
          - dependency-name: "node"
            update-types:
                - "version-update:semver-major"
